<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanne Peeraer — Ideas, Research, Teaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden}
#wrap{position:relative;width:100vw;height:100vh;background:#f6f4f7}
#bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#c{position:absolute;left:0;width:100%;z-index:1}

/* ── TOOLBAR ── */
#toolbar{
  position:absolute;top:0;left:0;right:0;
  display:flex;gap:5px;z-index:15;
  flex-wrap:wrap;justify-content:center;align-items:center;
  padding:8px 12px;min-height:44px;
  background:rgba(246,244,247,0.88);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(0,0,20,0.07);
}
.fb{
  font-size:11px;padding:5px 12px;border-radius:20px;cursor:pointer;
  border:1px solid rgba(0,0,20,0.18);color:rgba(0,0,20,0.50);
  background:transparent;transition:all .2s;letter-spacing:.02em;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.fb.on,.fb:hover{background:rgba(0,0,20,0.08);color:rgba(0,0,20,0.85);border-color:rgba(0,0,20,0.35)}

/* ── PANEL — desktop: right side sheet ── */
#panel{
  position:absolute;right:0;top:0;
  width:min(280px,85vw);height:100%;
  background:rgba(246,244,247,0.97);
  border-left:1px solid rgba(0,0,20,0.10);
  padding:20px 18px 32px;overflow-y:auto;
  transform:translateX(100%);transition:transform .3s ease;z-index:30;
}
#panel.open{transform:translateX(0)}
#pcl{
  position:absolute;top:12px;right:12px;background:none;border:none;
  cursor:pointer;color:rgba(0,0,20,0.35);font-size:22px;line-height:1;
  transition:color .2s;padding:4px;-webkit-tap-highlight-color:transparent;
}
#pcl:hover{color:rgba(0,0,20,0.85)}
#pname{font-size:15px;color:rgba(0,0,20,0.85);margin-bottom:14px;line-height:1.5;
  padding-right:24px;font-family:'Petit Formal Script',cursive;}
#ptext{font-size:13px;color:rgba(0,0,20,0.55);line-height:1.8;margin-bottom:22px;}
#plink{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;
  color:rgba(0,0,20,0.40);border-bottom:1px solid rgba(0,0,20,0.20);
  padding-bottom:2px;text-decoration:none;transition:all .2s;}
#plink:hover{color:rgba(0,0,20,0.85);border-color:rgba(0,0,20,0.50);}

/* ── LAYER LABELS ── */
#layer-labels{
  position:absolute;left:0;width:clamp(52px,11vw,130px);
  z-index:5;pointer-events:none;display:flex;flex-direction:column;
}
.layer-label{
  flex:1;display:flex;align-items:center;
  padding-left:clamp(6px,1.5vw,16px);
  font-size:clamp(7px,1vw,10px);letter-spacing:.10em;text-transform:uppercase;
  color:rgba(0,0,20,0.20);
}

/* ── LEGEND + HINT ── */
#legend{position:absolute;bottom:10px;left:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:5}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(0,0,20,0.35);}
.ld{width:6px;height:6px;border-radius:50%;flex-shrink:0;opacity:.8}
#hint{position:absolute;bottom:10px;right:10px;font-size:10px;color:rgba(0,0,20,0.22);white-space:nowrap;}

/* ── MOBILE (<600px): bottom sheet panel, no layer labels ── */
@media(max-width:600px){
  #toolbar{padding:6px 8px;gap:4px;}
  .fb{font-size:10px;padding:5px 9px;}
  #panel{
    top:auto;bottom:0;right:0;left:0;
    width:100%;height:auto;max-height:52vh;
    border-left:none;border-top:1px solid rgba(0,0,20,0.10);
    transform:translateY(100%);
    border-radius:16px 16px 0 0;
    padding:20px 20px 40px;
  }
  #panel.open{transform:translateY(0)}
  #panel::before{
    content:'';display:block;width:36px;height:4px;border-radius:2px;
    background:rgba(0,0,20,0.15);margin:0 auto 16px;
  }
  #pcl{top:16px}
  #layer-labels{display:none}
  #hint{display:none}
  #legend{bottom:6px;left:6px;}
}

/* ── TABLET (601–900px) ── */
@media(min-width:601px) and (max-width:900px){
  .fb{font-size:10px;padding:5px 10px;}
  #layer-labels{width:clamp(52px,9vw,80px)}
  .layer-label{font-size:8px;letter-spacing:.08em}
  #panel{width:min(260px,78vw)}
}
</style>

  <div id="legend">

</div>

// ── MAP original types to 3 cascade layers ────────────────────────────────
// phrase + theme → 'ideas'
// essay → 'research'
// teaching → 'teaching'
function layerOf(type){
  if(type==='phrase'||type==='theme') return 'ideas';
  if(type==='essay') return 'research';
  return 'teaching';
}

const RAW=[
  {id:'meaningmaking',type:'theme',url:'',label:'meaningmaking',
   desc:'The broadest frame: how human beings construct meaning from perception, sensation, and experience.',
   con:['heaven','rainbow']},
  {id:'weird-magic',type:'theme',url:'',label:'weird and magic',
   desc:'The serious engagement with myth, magic, and the occult as a language of complexity and entanglement.',
   con:['mirror3d']},
  {id:'active-inf',type:'theme',url:'',label:'active inference',
   desc:'We take action — including moving our eyes — to minimise prediction error and confirm our world model.',
   con:['your-eyes']},
  {id:'heaven',type:'phrase',url:'',label:'heaven is on earth',
   desc:'The most spiritually open phrase. The destination all the neuroscience builds toward.',
   con:['meaningmaking','weird-magic','active-inf','mirror3d','your-eyes','rainbow','why-tarot','inil-essay','complexity','relevance','uncert-econ','coaching','thinking-eyes']},
  {id:'mirror3d',type:'phrase',url:'',label:'the world is a 3d mirror',
   desc:'If the brain predicts the world based on itself, you are at all times reflected back at yourself.',
   con:[]},
  {id:'your-eyes',type:'phrase',url:'',label:'your eyes are intelligent',
   desc:'Vision is not passive reception — the eye thinks, selects, predicts.',
   con:[]},
  {id:'rainbow',type:'phrase',url:'',label:'rainbows exist because you do',
   desc:'The most compressed statement of the whole framework. The rainbow is genuinely co-created by the observer.',
   con:[]},
  {id:'why-tarot',type:'essay',url:'',label:'why tarot rocks',
   desc:'Essay on why tarot works, grounded in cognitive science and epidemiology of representations.',
   con:['complexity','inil-essay','meaningmaking','weird-magic']},
  {id:'inil-essay',type:'essay',url:'',label:'illusions & A-ha: EEG study',
   desc:'MASc Capstone LIS 2024. EEG study with 26 participants. INIL group showed higher mindfulness, curiosity, and gamma wave activity than the Rothko control.',
   con:['why-tarot','complexity','relevance','meaningmaking','active-inf']},
  {id:'complexity',type:'essay',url:'',label:'you are a complex system',
   desc:'Essay arguing perception, action, and self-awareness are complex dynamical systems. Wellbeing as navigating uncertainty, not a fixed state.',
   con:['why-tarot','inil-essay','relevance','coaching','meaningmaking','active-inf']},
  {id:'relevance',type:'essay',url:'',label:'optics & linguistics',
   desc:'Essay applying Relevance Theory to visual perception. Perception as inferential and parallel to communication.',
   con:['why-tarot','inil-essay','complexity','meaningmaking','active-inf']},
  {id:'uncert-econ',type:'teaching',url:'',label:'ambiguity workshops',
   desc:'Workshop at Cambridge exploring economics and climate change through perception and embodied cognition.',
   con:['meaningmaking','active-inf','inil-essay','your-eyes','heaven']},
  {id:'coaching',type:'teaching',url:'',label:'coaching and facilitation',
   desc:'Development coaching across LIS, Synthesis School, and Mori Building.',
   con:['meaningmaking','inil-essay','complexity']},
  {id:'thinking-eyes',type:'teaching',url:'',label:'thinking with your eyes',
   desc:'Talk and workshop — the most connected node in the network.',
   con:['meaningmaking','active-inf','mirror3d','rainbow','your-eyes','why-tarot','inil-essay','complexity']},
  ];

// Remap types to layers
RAW.forEach(n => { n.layer = layerOf(n.type); });

      const d = octx.getImageData(0, 0, sz, sz);
      for(let i = 0; i < d.data.length; i += 4){
        const lum = 0.299*d.data[i] + 0.587*d.data[i+1] + 0.114*d.data[i+2];
        d.data[i]=255; d.data[i+1]=255; d.data[i+2]=255; d.data[i+3]=lum;
      }
      octx.putImageData(d, 0, 0);
      createImageBitmap(oc).then(bmp => { ICON_ELS[layer] = bmp; });
    };
    img.src = ICON_IMGS[layer];
  });
})();

// ── LAYER COLOURS ──────────────────────────────────────────────────────────
const LAYER_COLS = {
  ideas:    {r:155,g:142,b:196},  // soft purple
  research: {r:104,g:144,b:180},  // blue
  teaching: {r:180,g:144,b:80},   // amber
};

// ── BUILD GRAPH ───────────────────────────────────────────────────────────
const nodeMap={};RAW.forEach(n=>{nodeMap[n.id]=n;});
const edgeSet=new Set(),EDGES=[];
RAW.forEach(n=>{(n.con||[]).forEach(tid=>{
  if(!nodeMap[tid])return;
  const key=[n.id,tid].sort().join('||');
  if(!edgeSet.has(key)){edgeSet.add(key);EDGES.push([n.id,tid]);}
});});

// ── CASCADE LAYOUT ────────────────────────────────────────────────────────
// Assign nodes to layers, then position them in horizontal bands
const LAYERS = ['ideas','research','teaching'];
const layerNodes = {};
LAYERS.forEach(l => { layerNodes[l] = []; });
RAW.forEach(n => { layerNodes[n.layer].push(n); });

// Assign x positions (evenly spaced within layer), y by layer band
// These are fractional positions — converted to canvas coords at draw time
const MARGIN_X = 0.12; // left margin fraction (leaves room for layer labels)
const LAYER_Y = { ideas: 0.22, research: 0.55, teaching: 0.82 };

// Stable seeded pseudo-random for consistent scatter on each load
function seededRand(seed) {
  const x = Math.sin(seed + 1) * 43758.5453123;
  return x - Math.floor(x);
}

// Minimum separation between nodes (in fractional units)
// Based on typical node pixel radius ~32px on a ~900px wide canvas → ~0.07 frac
const MIN_SEP = 0.09;
const BAND_HALF = 0.11; // vertical scatter range within band

LAYERS.forEach(layer => {
  const ns = layerNodes[layer];
  const count = ns.length;
  const lc0 = layer.charCodeAt(0);
  const lc1 = layer.charCodeAt(1) || 0;

  // Initial positions: evenly spread x, jittered y
  ns.forEach((node, i) => {
    const baseX = MARGIN_X + (i + 0.5) / count * (1 - MARGIN_X * 1.5);
    const xJitter = (seededRand(i * 7 + lc0) - 0.5) * (1.2 / count);
    const yJitter = (seededRand(i * 13 + lc1) - 0.5) * BAND_HALF * 2;
    node.fx = Math.max(MARGIN_X, Math.min(0.96, baseX + xJitter));
    node.fy = LAYER_Y[layer] + yJitter;
  });

  // Collision resolution: push apart nodes that are too close
  // Run several passes so clusters fully separate
  for(let pass = 0; pass < 60; pass++){
    for(let a = 0; a < ns.length; a++){
      for(let b = a + 1; b < ns.length; b++){
        const na = ns[a], nb = ns[b];
        const dx = nb.fx - na.fx;
        const dy = (nb.fy - na.fy) * 3; // weight y less (band constraint)
        const dist = Math.sqrt(dx*dx + dy*dy) || 0.001;
        if(dist < MIN_SEP){
          const push = (MIN_SEP - dist) / 2;
          const nx = (dx / dist) * push;
          const ny = (dy / dist) * push / 3;
          // Push apart, clamp x to valid range, allow small y movement within band
          na.fx = Math.max(MARGIN_X, Math.min(0.96, na.fx - nx));
          nb.fx = Math.max(MARGIN_X, Math.min(0.96, nb.fx + nx));
          na.fy = Math.max(LAYER_Y[layer] - BAND_HALF, Math.min(LAYER_Y[layer] + BAND_HALF, na.fy - ny));
          nb.fy = Math.max(LAYER_Y[layer] - BAND_HALF, Math.min(LAYER_Y[layer] + BAND_HALF, nb.fy + ny));
        }
      }
    }
  }
});

// Create positioned node objects
const nodes = RAW.map(n => ({...n}));
const nmap = {};
nodes.forEach(n => { nmap[n.id] = n; });

// ── CANVAS SETUP ──────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
let CW, CH, dpr;
let scale = 1, tx = 0, ty = 0;
let dragging = false, dragStart = {x:0,y:0}, panStart = {x:0,y:0};
let hovered = null, selected = null, activeFilter = 'ideas';
let shimmerT = 0;

// Measure toolbar height dynamically so canvas always starts below it
function getToolbarH(){ return document.getElementById('toolbar').getBoundingClientRect().height || 44; }

function resize(){
  dpr = devicePixelRatio||1;
  CW = wrap.clientWidth; CH = wrap.clientHeight;
  const tbH = Math.round(getToolbarH());
  // Position canvas below toolbar
  canvas.style.top = tbH + 'px';
  canvas.style.height = (CH - tbH) + 'px';
  canvas.width = CW * dpr;
  canvas.height = (CH - tbH) * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Layer labels also need to start below toolbar
  const ll = document.getElementById('layer-labels');
  if(ll){ ll.style.top = tbH + 'px'; ll.style.height = (CH - tbH) + 'px'; }
  _toolbarH = tbH;
}
let _toolbarH = 44;

// Convert fractional position to canvas pixel (accounting for pan/zoom)
function wpos(n){
  const panelOpen = document.getElementById('panel').classList.contains('open');
  // On mobile the panel is a bottom sheet — don't compress x
  const isMobile = window.innerWidth <= 600;
  const pw = (!isMobile && panelOpen) ? CW - Math.min(280, CW*0.85) : CW;
  const CH_canvas = CH - _toolbarH;
  return {
    x: n.fx * pw * scale + tx,
    y: n.fy * CH_canvas * scale + ty
  };
}

function nodeR(n){
  const deg = (n.con||[]).length;
  const base = n.type==='theme' ? 28+Math.min(deg,8) : n.type==='phrase' ? 24+Math.min(deg,6) : 20+Math.min(deg,5);
  return base;
}

function isActive(n){
  return activeFilter==='all' || n.layer===activeFilter;
}

function wrapText(ctx, text, maxPx){
  const words = text.split(' ');
  const lines = []; let cur = '';
  words.forEach(w => {
    const t = cur ? cur+' '+w : w;
    if(ctx.measureText(t).width > maxPx && cur){ lines.push(cur); cur = w; }
    else cur = t;
  });
  if(cur) lines.push(cur);
  return lines;
}

// ── DRAW ──────────────────────────────────────────────────────────────────
function draw(){
  shimmerT += 0.018;
  drawBg();
  ctx.clearRect(0, 0, CW, CH);

  // Layer dividers — very faint horizontal lines
  const CH_canvas = CH - _toolbarH;
  const divY1 = ((LAYER_Y.ideas + LAYER_Y.research) / 2) * CH_canvas * scale + ty;
  const divY2 = ((LAYER_Y.research + LAYER_Y.teaching) / 2) * CH_canvas * scale + ty;
  ctx.strokeStyle = 'rgba(0,0,20,0.08)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  [divY1, divY2].forEach(y => {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
  });
  ctx.setLineDash([]);

  // ── EDGES ──
  EDGES.forEach(([aid, bid]) => {
    const a = nmap[aid], b = nmap[bid]; if(!a||!b) return;
    const pa = wpos(a), pb = wpos(b);
    let al, lw;
    if(selected){
      const conn = selected.id===aid || selected.id===bid;
      if(!conn) return;
      al = 0.82; lw = 2.0;
    } else if(activeFilter !== 'all'){
      const av = isActive(a), bv = isActive(b);
      al = (av && bv) ? 0.30 : (av || bv) ? 0.08 : 0.04;
      lw = 1.4;
    } else {
      al = 0.18; lw = 1.4;
    }
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
    ctx.strokeStyle = `rgba(255,255,255,${al})`; ctx.lineWidth = lw; ctx.stroke();
  });

  // ── NODES ──
  nodes.forEach(n => {
    const p = wpos(n);
    const r = nodeR(n) * scale;
    const lc = LAYER_COLS[n.layer] || {r:150,g:150,b:170};
    const isSel = selected?.id === n.id;
    const isConn = selected && (selected.con||[]).includes(n.id);
    const isHov = !selected && hovered?.id === n.id;
    const active = isActive(n);

    let alpha;
    if(selected) alpha = isSel ? 1 : isConn ? 0.88 : 0.15;
    else alpha = active ? 1 : 0.35;

    const prominent = active || isSel;

    ctx.globalAlpha = alpha;

    // ── ICON ──
    const _iconImg = ICON_ELS[n.layer];
    const _mob = window.innerWidth <= 600;
    const baseFs = n.type==='theme' ? (_mob?14:13) : n.type==='phrase' ? (_mob?13:12) : (_mob?12:11);
    const fs = Math.max(baseFs, baseFs * scale);
    ctx.font = `400 ${fs}px 'Petit Formal Script',cursive`;
    const textLines = wrapText(ctx, n.label, r * 1.65); // cached for icon + label
    const lh = fs * 1.4;
    const th = textLines.length * lh;
    const iconRatio = ICON_RATIOS[n.layer] || 0.8;
    const iconH = Math.max(window.innerWidth<=600?28:24, (window.innerWidth<=600?28:24) * scale);
    const iconW = iconH * iconRatio;
    const iconX = p.x - iconW / 2;
    const iconY = p.y - th / 2 - iconH - 4 * scale;
    if(_iconImg){
      const prevA = ctx.globalAlpha;
      ctx.globalAlpha = alpha * (prominent ? 0.82 : 0.28);
      ctx.drawImage(_iconImg, iconX, iconY, iconW, iconH);
      ctx.globalAlpha = prevA;
    }

    // ── LABEL ──
    // label — reuse textLines, th, lh from above
    ctx.font = `400 ${fs}px 'Petit Formal Script',cursive`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(0,0,20,${prominent ? 0.88 : 0.42})`;
    textLines.forEach((l, i) => ctx.fillText(l, p.x, p.y - th/2 + lh*i + lh/2));

    ctx.globalAlpha = 1;
  });

}

// ── INTERACTION ────────────────────────────────────────────────────────────
// Cache bounding rect — only update on resize
let _rect = null;
function getRect(){ if(!_rect) _rect = canvas.getBoundingClientRect(); return _rect; }
window.addEventListener('resize', () => { _rect = null; });

function nodeAt(mx, my){
  for(let i = nodes.length-1; i >= 0; i--){
    const n = nodes[i], p = wpos(n);
    const r = (nodeR(n) + (window.innerWidth<=600?26:18)) * scale;
    if((mx-p.x)**2 + (my-p.y)**2 <= r*r) return n;
  }
  return null;
}

canvas.addEventListener('mousemove', e => {
  const rect = getRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if(dragging){
    tx = panStart.x + (e.clientX - dragStart.x);
    ty = panStart.y + (e.clientY - dragStart.y);
    canvas.style.cursor = 'grabbing';
    return;
  }
  const prev = hovered;
  hovered = nodeAt(mx, my);
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
});

canvas.addEventListener('mousedown', e => {
  dragging = true;
  dragStart = {x: e.clientX, y: e.clientY};
  panStart = {x: tx, y: ty};
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('mouseup', e => {
  const moved = Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y);
  dragging = false;
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
  if(moved < 5){
    const rect = getRect();
    const n = nodeAt(e.clientX - rect.left, e.clientY - rect.top);
    if(n){ selected = n; openPanel(n); }
    else { selected = null; closePanel(); }
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = getRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const d = e.deltaY > 0 ? 0.88 : 1.12;
  const ns = Math.max(0.3, Math.min(3, scale * d));
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns;
}, {passive: false});

// ── TOUCH EVENTS ────────────────────────────────────────────────────────────
let _touches = {};
let _pinchDist0 = null;

function touchPos(t){
  const rect = getRect();
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  _rect = null; // refresh rect on touch start
  if(e.touches.length === 1){
    const p = touchPos(e.touches[0]);
    dragging = true;
    dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    panStart  = { x: tx, y: ty };
    _pinchDist0 = null;
  } else if(e.touches.length === 2){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    _pinchDist0 = Math.sqrt(dx*dx + dy*dy);
    panStart = { x: tx, y: ty };
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    dragStart = { x: midX, y: midY };
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length === 1 && dragging){
    tx = panStart.x + (e.touches[0].clientX - dragStart.x);
    ty = panStart.y + (e.touches[0].clientY - dragStart.y);
  } else if(e.touches.length === 2 && _pinchDist0){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const ratio = dist / _pinchDist0;
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = getRect();
    const mx = midX - rect.left, my = midY - rect.top;
    const ns = Math.max(0.3, Math.min(3, scale * ratio));
    tx = mx - (mx - panStart.x - (dragStart.x - midX)) * (ns / scale);
    ty = my - (my - panStart.y - (dragStart.y - midY)) * (ns / scale);
    // update for incremental pinch
    _pinchDist0 = dist;
    panStart = { x: tx - (midX - rect.left - mx + mx), y: ty };
    scale = ns;
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if(e.changedTouches.length === 1 && e.touches.length === 0){
    const movedX = Math.abs(e.changedTouches[0].clientX - dragStart.x);
    const movedY = Math.abs(e.changedTouches[0].clientY - dragStart.y);
    if(movedX < 8 && movedY < 8){
      // Tap — select node
      const rect = getRect();
      const p = touchPos(e.changedTouches[0]);
      const n = nodeAt(p.x, p.y);
      if(n){ selected = n; openPanel(n); }
      else { selected = null; closePanel(); }
    }
    dragging = false;
    _pinchDist0 = null;
  }
}, { passive: false });

// ── PANEL ──────────────────────────────────────────────────────────────────
function openPanel(n){
  document.getElementById('pname').textContent = n.label;
  const link = document.getElementById('plink');
  if(n.url && n.url.length > 0){
    link.href = n.url;
    link.style.opacity = '1';
    link.style.pointerEvents = 'auto';
  } else {
    link.href = '#';
    link.style.opacity = '0.35';
    link.style.pointerEvents = 'none';
  }
  document.getElementById('panel').classList.add('open');
}

function closePanel(){ document.getElementById('panel').classList.remove('open'); selected=null; }
function selectNode(id){ const n=nmap[id]; if(n){ selected=n; openPanel(n); } }
function setFilter(f,btn){
  activeFilter=f; selected=null; closePanel();
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

window.selectNode=selectNode; window.closePanel=closePanel; window.setFilter=setFilter;

// ── SINGLE RENDER LOOP ────────────────────────────────────────────────────
function loop(){
  draw();
  requestAnimationFrame(loop);
}

// ── BACKGROUND ────────────────────────────────────────────────────────────
// ── IRIDESCENT WATER BACKGROUND ──────────────────────────────────────────
// Inspired by: pearlescent water caustics, chromatic aberration ribbons
// Base: very pale warm white. Colour lives in thin shimmering edges.
const bgCanvas = document.getElementById('bg');
const bgCtx = bgCanvas.getContext('2d');
let bgT = 0;

function resizeBg() {
  bgCanvas.width  = bgCanvas.offsetWidth  * (devicePixelRatio||1);
  bgCanvas.height = bgCanvas.offsetHeight * (devicePixelRatio||1);
  bgCtx.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0);
}

// Caustic blobs — large, near-white, slow
// They create the pearl base and the dark pooling in the reference
const CAUSTICS = [
  { ox:0.30, oy:0.22, sx:0.16, sy:0.11, sp:0.38, ph:0.0,  r:0.70, rb:[248,244,248] },
  { ox:0.68, oy:0.18, sx:0.14, sy:0.13, sp:0.29, ph:1.1,  r:0.62, rb:[244,245,250] },
  { ox:0.20, oy:0.65, sx:0.18, sy:0.10, sp:0.33, ph:2.3,  r:0.58, rb:[246,242,246] },
  { ox:0.72, oy:0.70, sx:0.12, sy:0.16, sp:0.41, ph:0.7,  r:0.65, rb:[242,244,248] },
  { ox:0.50, oy:0.50, sx:0.20, sy:0.14, sp:0.25, ph:1.8,  r:0.75, rb:[250,248,252] },
  { ox:0.85, oy:0.42, sx:0.10, sy:0.18, sp:0.45, ph:3.1,  r:0.50, rb:[244,248,250] },
];

// Chromatic ribbons — thin, prismatic, fast-moving
// The iridescent lines in the reference image
const RIBBONS = [
  // [colour_r, colour_g, colour_b, opacity, x_origin, y_origin, angle, waveSp, waveAmp, ph]
  [200, 210, 235,  0.22, 0.35, 0.30, 0.3,  0.55, 0.08, 0.0],   // soft blue
  [235, 205, 215,  0.18, 0.60, 0.45, -0.2, 0.48, 0.10, 1.2],   // rose
  [210, 235, 220,  0.16, 0.25, 0.60, 0.5,  0.62, 0.07, 2.4],   // pale green
  [230, 215, 240,  0.20, 0.75, 0.25, -0.4, 0.51, 0.09, 0.8],   // lavender
  [215, 230, 240,  0.15, 0.50, 0.75, 0.15, 0.44, 0.11, 3.2],   // sky
  [240, 220, 210,  0.14, 0.15, 0.35, 0.7,  0.58, 0.06, 1.9],   // blush
  [205, 225, 235,  0.17, 0.80, 0.62, -0.3, 0.52, 0.09, 0.4],   // ice blue
  [235, 210, 230,  0.13, 0.40, 0.15, 0.45, 0.46, 0.12, 2.1],   // mauve
];

function drawBg() {
  bgT += 0.0012; // very slow drift
  const W = bgCanvas.offsetWidth, H = bgCanvas.offsetHeight;
  bgCtx.clearRect(0, 0, W, H);

  // ── BASE: pearl white ──────────────────────────────────────────────────
  bgCtx.fillStyle = '#f6f4f7';
  bgCtx.fillRect(0, 0, W, H);

  // ── CAUSTIC BLOBS: large soft light pools ──────────────────────────────
  bgCtx.globalCompositeOperation = 'multiply';
  CAUSTICS.forEach(c => {
    const cx = (c.ox + Math.sin(bgT * c.sp + c.ph) * c.sx) * W;
    const cy = (c.oy + Math.cos(bgT * c.sp * 0.7 + c.ph + 0.5) * c.sy) * H;
    const pulse = 1 + 0.05 * Math.sin(bgT * 0.8 + c.ph);
    const rad = c.r * Math.max(W, H) * pulse;
    const [r,g,b] = c.rb;
    const grad = bgCtx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    grad.addColorStop(0,   `rgba(${r},${g},${b},0.72)`);
    grad.addColorStop(0.4, `rgba(${r},${g},${b},0.40)`);
    grad.addColorStop(0.75,`rgba(${r},${g},${b},0.12)`);
    grad.addColorStop(1,   `rgba(${r},${g},${b},0)`);
    bgCtx.beginPath(); bgCtx.arc(cx, cy, rad, 0, Math.PI*2);
    bgCtx.fillStyle = grad; bgCtx.fill();
  });

  // ── DARK POOLING: subtle depth areas ──────────────────────────────────
  // The reference has cool grey-blue pools — simulate with a couple of
  // slow darker blobs composited with multiply
  [[0.45, 0.55, 0.42, 0.28, 0.4, 1.1],[0.25, 0.40, 0.38, 0.22, 0.55, 2.4]].forEach(([ox,oy,sp,a,r,ph])=>{
    const cx = (ox + Math.sin(bgT*sp+ph)*0.12)*W;
    const cy = (oy + Math.cos(bgT*sp*0.8+ph)*0.10)*H;
    const rad = r * Math.max(W,H);
    const grad = bgCtx.createRadialGradient(cx,cy,0,cx,cy,rad);
    grad.addColorStop(0,   `rgba(180,185,200,${a})`);
    grad.addColorStop(0.5, `rgba(190,192,205,${a*0.4})`);
    grad.addColorStop(1,   `rgba(200,200,210,0)`);
    bgCtx.beginPath(); bgCtx.arc(cx,cy,rad,0,Math.PI*2);
    bgCtx.fillStyle=grad; bgCtx.fill();
  });

  bgCtx.globalCompositeOperation = 'source-over';

}

window.addEventListener('resize', resizeBg);
resizeBg();
drawBg();


window.addEventListener('resize', ()=>{ resize(); resizeBg(); _rect = null; });
resize();
resizeBg();
loop();
</script>
</body></html>
