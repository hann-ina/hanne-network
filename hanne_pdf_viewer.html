<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Journal — Hanne Peeraer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&family=Cormorant:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg:       #f5f3f0;
  --surface:  #faf9f7;
  --ink:      rgba(20,18,14,0.82);
  --ink-mid:  rgba(20,18,14,0.40);
  --ink-faint:rgba(20,18,14,0.14);
  --accent:   rgba(20,18,14,0.08);
  --serif:    'Cormorant', Georgia, serif;
  --script:   'Petit Formal Script', cursive;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); }
body {
  font-family: var(--serif);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOOLBAR ── */
#toolbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 52px;
  background: rgba(245,243,240,0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--ink-faint);
  gap: 16px;
  z-index: 10;
}
#title-label {
  font-family: var(--script);
  font-size: 15px;
  color: var(--ink-mid);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.btn {
  background: none;
  border: 1px solid var(--ink-faint);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 13px;
  padding: 5px 14px;
  cursor: pointer;
  transition: all 0.18s;
  letter-spacing: 0.03em;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  border-radius: 20px;
}
.btn:hover { background: var(--accent); border-color: var(--ink-mid); }
.btn:disabled { opacity: 0.28; pointer-events: none; }
.btn-icon {
  width: 34px; height: 34px;
  padding: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  border-radius: 50%;
}
#page-info {
  font-size: 12px;
  color: var(--ink-mid);
  letter-spacing: 0.06em;
  min-width: 64px;
  text-align: center;
  font-style: italic;
}
#zoom-info {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
  min-width: 44px;
  text-align: right;
}

/* ── VIEWER ── */
#viewer-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 20px 48px;
  gap: 20px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

/* Loading state */
#loading {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: var(--bg);
  z-index: 50;
  transition: opacity 0.5s ease;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.loading-title {
  font-family: var(--script);
  font-size: 22px;
  color: var(--ink-mid);
}
.progress-track {
  width: 180px; height: 1px;
  background: var(--ink-faint);
  position: relative; overflow: hidden;
}
.progress-bar {
  position: absolute; left: 0; top: 0; height: 100%;
  background: var(--ink-mid);
  width: 0%;
  transition: width 0.3s ease;
}
.loading-sub {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.10em;
  font-style: italic;
}

/* Page canvas wrapper */
.page-wrap {
  position: relative;
  background: var(--surface);
  box-shadow: 0 2px 18px rgba(20,18,14,0.10), 0 0 0 0.5px var(--ink-faint);
  transition: box-shadow 0.2s;
  cursor: grab;
}
.page-wrap:active { cursor: grabbing; }
.page-wrap canvas { display: block; }

/* Page number label below each page */
.page-num {
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
  margin-top: 8px;
  font-style: italic;
}

/* ── RESPONSIVE ── */
@media(max-width: 600px) {
  #toolbar { padding: 0 12px; height: 48px; }
  #title-label { font-size: 13px; }
  .btn { font-size: 12px; padding: 5px 11px; }
  #viewer-wrap { padding: 16px 10px 40px; gap: 14px; }
  #zoom-info { display: none; }
}

/* Scrollbar */
#viewer-wrap::-webkit-scrollbar { width: 5px; }
#viewer-wrap::-webkit-scrollbar-track { background: transparent; }
#viewer-wrap::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="loading-title">Research Journal</div>
  <div class="progress-track"><div class="progress-bar" id="prog"></div></div>
  <div class="loading-sub">loading</div>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <div id="title-label">Research Journal — Hanne Peeraer</div>
  <div class="controls">
    <button class="btn btn-icon" id="btn-prev" title="Previous page">←</button>
    <span id="page-info">— / —</span>
    <button class="btn btn-icon" id="btn-next" title="Next page">→</button>
    <button class="btn" id="btn-zoom-out" title="Zoom out">−</button>
    <button class="btn" id="btn-zoom-in" title="Zoom in">+</button>
    <span id="zoom-info">100%</span>
    <button class="btn" id="btn-fit" title="Fit to width">fit</button>
    <a class="btn" href="https://hann-ina.github.io/hanne-network/research-journal.pdf"
       download target="_blank" title="Download PDF">↓</a>
  </div>
</div>

<!-- Page viewer -->
<div id="viewer-wrap" id="viewer"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const PDF_URL = 'https://hann-ina.github.io/hanne-network/research-journal.pdf';
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── STATE ────────────────────────────────────────────────────────────────────
let pdfDoc = null;
let totalPages = 0;
let currentPage = 1;
let zoomLevel = 1.0; // will be set to fit width on load
let rendering = false;
let pageCache = {}; // cache rendered canvases

// ── ELEMENTS ─────────────────────────────────────────────────────────────────
const viewer     = document.getElementById('viewer-wrap');
const btnPrev    = document.getElementById('btn-prev');
const btnNext    = document.getElementById('btn-next');
const btnZoomIn  = document.getElementById('btn-zoom-in');
const btnZoomOut = document.getElementById('btn-zoom-out');
const btnFit     = document.getElementById('btn-fit');
const pageInfo   = document.getElementById('page-info');
const zoomInfo   = document.getElementById('zoom-info');
const loading    = document.getElementById('loading');
const prog       = document.getElementById('prog');

// ── LOAD PDF ─────────────────────────────────────────────────────────────────
const loadTask = pdfjsLib.getDocument({
  url: PDF_URL,
  cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
  cMapPacked: true,
});

loadTask.onProgress = (p) => {
  if(p.total) prog.style.width = Math.round(p.loaded/p.total*100) + '%';
};

loadTask.promise.then(pdf => {
  pdfDoc = pdf;
  totalPages = pdf.numPages;
  setFitZoom().then(() => {
    renderAllPages().then(() => {
      loading.classList.add('hidden');
      scrollToPage(1);
    });
  });
}).catch(err => {
  document.getElementById('loading').innerHTML =
    `<div class="loading-title" style="color:rgba(180,60,40,0.7)">Could not load PDF</div>
     <div class="loading-sub">${err.message}</div>`;
});

// ── FIT TO WIDTH ──────────────────────────────────────────────────────────────
async function setFitZoom() {
  const page = await pdfDoc.getPage(1);
  const vp = page.getViewport({ scale: 1 });
  const availW = viewer.clientWidth - 40;
  zoomLevel = Math.min(availW / vp.width, 2.0);
  updateZoomLabel();
}

// ── RENDER ALL PAGES ──────────────────────────────────────────────────────────
async function renderAllPages() {
  viewer.innerHTML = '';
  pageCache = {};
  for(let i = 1; i <= totalPages; i++) {
    prog.style.width = Math.round(i / totalPages * 100) + '%';
    await renderPage(i);
  }
}

async function renderPage(pageNum) {
  const page = await pdfDoc.getPage(pageNum);
  const vp = page.getViewport({ scale: zoomLevel * (devicePixelRatio || 1) });
  const displayVp = page.getViewport({ scale: zoomLevel });

  const wrap = document.createElement('div');
  wrap.className = 'page-wrap';
  wrap.id = `page-${pageNum}`;
  wrap.style.width  = Math.round(displayVp.width)  + 'px';
  wrap.style.height = Math.round(displayVp.height) + 'px';

  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(vp.width);
  canvas.height = Math.round(vp.height);
  canvas.style.width  = Math.round(displayVp.width)  + 'px';
  canvas.style.height = Math.round(displayVp.height) + 'px';

  wrap.appendChild(canvas);
  viewer.appendChild(wrap);

  const label = document.createElement('div');
  label.className = 'page-num';
  label.textContent = pageNum;
  viewer.appendChild(label);

  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  pageCache[pageNum] = wrap;
}

// ── SCROLL TO PAGE ─────────────────────────────────────────────────────────────
function scrollToPage(n) {
  const el = document.getElementById(`page-${n}`);
  if(el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  currentPage = n;
  updateUI();
}

// ── CURRENT PAGE from scroll ──────────────────────────────────────────────────
let scrollTimer = null;
viewer.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    for(let i = totalPages; i >= 1; i--) {
      const el = document.getElementById(`page-${i}`);
      if(!el) continue;
      const rect = el.getBoundingClientRect();
      if(rect.top <= viewer.getBoundingClientRect().top + viewer.clientHeight * 0.5) {
        currentPage = i;
        updateUI();
        break;
      }
    }
  }, 80);
});

// ── UI UPDATE ─────────────────────────────────────────────────────────────────
function updateUI() {
  pageInfo.textContent = `${currentPage} / ${totalPages}`;
  btnPrev.disabled = currentPage <= 1;
  btnNext.disabled = currentPage >= totalPages;
  updateZoomLabel();
}

function updateZoomLabel() {
  zoomInfo.textContent = Math.round(zoomLevel * 100) + '%';
}

// ── CONTROLS ──────────────────────────────────────────────────────────────────
btnPrev.addEventListener('click', () => scrollToPage(Math.max(1, currentPage - 1)));
btnNext.addEventListener('click', () => scrollToPage(Math.min(totalPages, currentPage + 1)));

btnZoomIn.addEventListener('click',  () => changeZoom(1.20));
btnZoomOut.addEventListener('click', () => changeZoom(1/1.20));

btnFit.addEventListener('click', async () => {
  await setFitZoom();
  const prev = currentPage;
  await renderAllPages();
  loading.classList.add('hidden');
  scrollToPage(prev);
});

async function changeZoom(factor) {
  zoomLevel = Math.min(4, Math.max(0.3, zoomLevel * factor));
  updateZoomLabel();
  const prev = currentPage;
  await renderAllPages();
  loading.classList.add('hidden');
  scrollToPage(prev);
}

// ── KEYBOARD ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown')  scrollToPage(Math.min(totalPages, currentPage + 1));
  if(e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    scrollToPage(Math.max(1, currentPage - 1));
  if(e.key === '+' || e.key === '=') changeZoom(1.20);
  if(e.key === '-')                  changeZoom(1/1.20);
});

// ── WHEEL ZOOM (ctrl/cmd + scroll) ────────────────────────────────────────────
viewer.addEventListener('wheel', e => {
  if(e.ctrlKey || e.metaKey) {
    e.preventDefault();
    changeZoom(e.deltaY < 0 ? 1.12 : 1/1.12);
  }
}, { passive: false });

// ── RESIZE ────────────────────────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(async () => {
    const prev = currentPage;
    await setFitZoom();
    await renderAllPages();
    loading.classList.add('hidden');
    scrollToPage(prev);
  }, 400);
});
</script>
</body>
</html>
